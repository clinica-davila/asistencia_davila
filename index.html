<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asistencia Dávila</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f6f7;display:grid;place-items:center;min-height:100vh;margin:0;color:#28323b;padding:18px}.card{background:white;border-radius:20px;padding:30px;width:min(94vw,480px);box-shadow:0 10px 40px #0001}h1{text-align:center}p{text-align:center;color:#667}label{display:block;margin:18px 0 7px;font-weight:bold}input,select,button{width:100%;padding:14px;font-size:17px;border-radius:10px}input,select{border:1px solid #bbc6ca;background:white}button{background:#009c96;border:0;color:white;font-weight:bold;margin-top:24px;cursor:pointer}.hidden{display:none}.brand{text-align:center;font-size:30px;font-weight:bold;color:#555}.notice{font-size:13px;color:#687;text-align:center;margin-top:15px}
</style>
</head>
<body><main class="card">
<div class="brand">Dávila</div>
<section id="config"><h1>Configurar sesión</h1><p>Gimnasia Laboral</p>
<label for="fecha">Fecha</label><input type="date" id="fecha">
<label for="edificio">Edificio</label><select id="edificio"></select>
<label for="seccion">Sección / Área</label><select id="seccion"><option value="">Selecciona una sección</option></select>
<div id="otra-wrap" class="hidden"><label for="otra">Nombre de la sección</label><input id="otra" maxlength="100" placeholder="Escribe la sección"></div>
<button id="iniciar">Iniciar sesión de asistencia</button>
<div class="notice">Las secciones reales se configurarán cuando tengamos el listado de cada edificio.</div>
</section>
<section id="registro" class="hidden"><h1>Registro de asistencia</h1><p id="resumen"></p><label>Ingresa tu RUT</label><input placeholder="12.345.678-9" disabled><div class="notice">Próximamente: búsqueda y registro de participantes.</div><button id="volver">Volver a configuración (demo)</button></section>
</main><script>
const $=id=>document.getElementById(id);
const n=new Date();$('fecha').value=new Date(n.getTime()-n.getTimezoneOffset()*60000).toISOString().slice(0,10);
for(const e of 'ABCDEFGHI')$('edificio').add(new Option('Edificio '+e,e));
// Reemplazar las listas vacías con los nombres reales, una vez confirmados.
const seccionesPorEdificio={A:[],B:[],C:[],D:[],E:[],F:[],G:[],H:[],I:[]};
function cargarSecciones(){const s=$('seccion');s.replaceChildren(new Option('Selecciona una sección',''));for(const nombre of seccionesPorEdificio[$('edificio').value]||[])s.add(new Option(nombre,nombre));s.add(new Option('Otra sección (escribir)','__otra__'));$('otra-wrap').classList.add('hidden');$('otra').value=''}
$('edificio').addEventListener('change',cargarSecciones);
$('seccion').addEventListener('change',()=>{$('otra-wrap').classList.toggle('hidden',$('seccion').value!=='__otra__')});
cargarSecciones();
$('iniciar').onclick=()=>{const area=$('seccion').value==='__otra__'?$('otra').value.trim():$('seccion').value;if(!$('fecha').value||!area){alert('Completa la fecha y selecciona o escribe una sección.');return}const [y,m,d]=$('fecha').value.split('-');$('resumen').textContent=d+'/'+m+'/'+y+' · Edificio '+$('edificio').value+' · '+area;$('config').classList.add('hidden');$('registro').classList.remove('hidden')};
$('volver').onclick=()=>{$('registro').classList.add('hidden');$('config').classList.remove('hidden')};
</script></body></html>
