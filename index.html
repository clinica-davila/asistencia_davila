<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asistencia Dávila</title><style>body{font-family:Arial;background:#f4f6f7;display:grid;place-items:center;min-height:100vh;margin:0;color:#28323b}.card{background:white;border-radius:20px;padding:30px;width:min(90vw,480px);box-shadow:0 10px 40px #0001}h1{text-align:center}p{text-align:center;color:#667}label{display:block;margin:18px 0 7px;font-weight:bold}input,select,button{box-sizing:border-box;width:100%;padding:14px;font-size:17px;border-radius:10px}input,select{border:1px solid #bbc6ca}button{background:#009c96;border:0;color:white;font-weight:bold;margin-top:24px;cursor:pointer}.hidden{display:none}.brand{text-align:center;font-size:30px;font-weight:bold;color:#555}.notice{font-size:13px;color:#687;text-align:center;margin-top:15px}</style></head><body><main class="card"><div class="brand">Dávila</div><section id="config"><h1>Configurar sesión</h1><p>Gimnasia Laboral</p><label for="fecha">Fecha</label><input type="date" id="fecha"><label for="edificio">Edificio</label><select id="edificio"></select><label for="seccion">Sección / Área</label><input id="seccion" placeholder="Ej. Urgencias"><button id="iniciar">Iniciar sesión de asistencia</button></section><section id="registro" class="hidden"><h1>Registro de asistencia</h1><p id="resumen"></p><label>Ingresa tu RUT</label><input placeholder="12.345.678-9" disabled><div class="notice">Próximamente: búsqueda y registro de participantes.</div><button id="volver">Volver a configuración (demo)</button></section></main><script>const $=id=>document.getElementById(id);const n=new Date();$('fecha').value=new Date(n.getTime()-n.getTimezoneOffset()*60000).toISOString().slice(0,10);for(const e of 'ABCDEFGHI'){$('edificio').add(new Option('Edificio '+e,e))}$('iniciar').onclick=()=>{if(!$('fecha').value||!$('seccion').value.trim()){alert('Completa fecha y sección');return}const [y,m,d]=$('fecha').value.split('-');$('resumen').textContent=d+'/'+m+'/'+y+' · Edificio '+$('edificio').value+' · '+$('seccion').value;$('config').classList.add('hidden');$('registro').classList.remove('hidden')};$('volver').onclick=()=>{$('registro').classList.add('hidden');$('config').classList.remove('hidden')};</script></body></html>
